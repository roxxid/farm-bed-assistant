<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Bed — Square-Foot Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --soil: #2b2318;
    --soil-2: #3a2f20;
    --ink: #26201a;
    --ink-soft: #6b6156;
    --paper: #f6f2ea;
    --card: #fffdf8;
    --line: #e4dccb;
    --line-strong: #cfc4ac;
    --leaf: #4a7c3f;
    --leaf-deep: #35602f;
    --leaf-pale: #e7efe0;
    --sun: #d9902e;
    --sun-pale: #f7ecd7;
    --water: #4a7fa5;
    --water-pale: #e3eef5;
    --danger: #b4503a;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(43,35,24,.06), 0 8px 24px -12px rgba(43,35,24,.18);
    --font-display: "Fraunces", Georgia, serif;
    --font-ui: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-ui);
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: var(--font-ui); cursor: pointer; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 {
    font-family: var(--font-display);
    font-weight: 600; font-size: 21px; letter-spacing: -.01em;
  }
  .brand .sub { color: var(--ink-soft); font-size: 12.5px; }
  .spacer { flex: 1; }
  .weather {
    display: flex; gap: 8px; align-items: center;
  }
  .chip {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 12px; border-radius: 999px;
    background: var(--paper); border: 1px solid var(--line);
    font-size: 12.5px; font-weight: 600; color: var(--ink);
    white-space: nowrap;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip.sun { } .chip.sun .dot { background: var(--sun); }
  .chip.water .dot { background: var(--water); }
  .chip.temp .dot { background: var(--leaf); }
  .chip .val { color: var(--ink); }
  .chip .lbl { color: var(--ink-soft); font-weight: 500; }
  .chip.placeholder { border-style: dashed; }

  /* ---------- layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: 250px 1fr 320px;
    gap: 0;
    height: calc(100vh - 61px);
    overflow: hidden;
  }

  /* ---------- palette (left) ---------- */
  .palette {
    background: var(--card);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .palette-head {
    padding: 16px 16px 10px;
    font-family: var(--font-display); font-weight: 600; font-size: 15px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .palette-head .hint { font-family: var(--font-ui); font-weight: 500; font-size: 11px; color: var(--ink-soft); }
  .group { padding: 6px 16px 12px; }
  .group-title {
    font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-soft);
    padding: 8px 0 6px;
  }
  .seed {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--card);
    margin-bottom: 6px;
    cursor: grab;
    user-select: none;
    transition: border-color .12s, transform .12s, box-shadow .12s;
  }
  .seed:hover { border-color: var(--leaf); transform: translateY(-1px); box-shadow: var(--shadow); }
  .seed:active { cursor: grabbing; }
  .seed .ico {
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center; font-size: 16px;
    background: var(--leaf-pale); flex: none;
  }
  .seed .meta { flex: 1; min-width: 0; }
  .seed .name { font-weight: 600; font-size: 13px; }
  .seed .spec { font-size: 11px; color: var(--ink-soft); display: flex; gap: 6px; }
  .seed .spec span { white-space: nowrap; }
  .seed .drag-handle { color: var(--line-strong); font-size: 14px; }
  .seed.dragging { opacity: .4; }

  /* ---------- grid (center) ---------- */
  .stage {
    display: flex; flex-direction: column;
    overflow-y: auto;
    padding: 20px 24px 28px;
  }
  .stage-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .stage-head h2 { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
  .stage-head .meta { color: var(--ink-soft); font-size: 12.5px; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  .btn {
    padding: 8px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--line-strong);
    background: var(--card); color: var(--ink);
    font-weight: 600; font-size: 12.5px;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--leaf); border-color: var(--leaf); color: #fff; }
  .btn.primary:hover { background: var(--leaf-deep); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-soft); }
  .btn.ghost:hover { color: var(--danger); border-color: transparent; }

  .bed {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    max-width: 720px;
    background: var(--soil);
    padding: 22px;
    border-radius: 20px;
    box-shadow: 0 2px 6px rgba(43,35,24,.15), 0 20px 50px -20px rgba(43,35,24,.5);
    position: relative;
  }
  .bed::before {
    content: "";
    position: absolute; inset: 10px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,.08);
    pointer-events: none;
  }
  .cell {
    aspect-ratio: 1;
    background: var(--soil-2);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.06);
    position: relative;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
    transition: background .12s, box-shadow .12s, transform .1s;
    min-height: 0;
  }
  .cell:hover { background: #453823; }
  .cell.drag-over {
    background: #51432a;
    box-shadow: inset 0 0 0 2px var(--sun);
  }
  .cell.filled { background: linear-gradient(160deg, #4a3c28, #3a2f20); }
  .cell .ico { font-size: 20px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
  .cell .cname { font-size: 10px; font-weight: 600; color: #efe7d5; max-width: 90%; text-align: center; line-height: 1.1; }
  .cell .cden { font-size: 9px; color: #b9ac8f; font-weight: 600; }
  .cell .idx {
    position: absolute; top: 4px; left: 6px;
    font-size: 9px; color: #8d8268; font-weight: 600;
  }
  .cell.empty { background: var(--soil-2); }
  .cell.empty .plus { color: #6a5f47; font-size: 18px; opacity: .55; }
  .cell.selected { box-shadow: 0 0 0 2px var(--sun), 0 0 0 4px rgba(217,144,46,.25); }
  .cell.ready { box-shadow: inset 0 0 0 2px var(--sun); }

  .legend {
    display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap;
    font-size: 11.5px; color: var(--ink-soft);
  }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .legend .swatch.s-ready { background: var(--sun); }
  .legend .swatch.s-soil { background: var(--soil-2); }

  /* ---------- inspector (right) ---------- */
  .inspector {
    background: var(--card);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .insp-empty {
    padding: 32px 20px; text-align: center; color: var(--ink-soft);
    font-size: 13px;
  }
  .insp-empty .big { font-size: 28px; margin-bottom: 8px; }
  .insp-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .insp-head { display: flex; align-items: center; gap: 10px; }
  .insp-head .ico {
    width: 40px; height: 40px; border-radius: 10px; font-size: 22px;
    display: grid; place-items: center; background: var(--leaf-pale);
  }
  .insp-head .t { font-family: var(--font-display); font-weight: 600; font-size: 18px; }
  .insp-head .s { font-size: 12px; color: var(--ink-soft); }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .field input {
    padding: 8px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--line-strong); background: var(--paper);
    font-family: var(--font-ui); font-size: 13px; color: var(--ink);
  }
  .field input:focus { outline: 2px solid var(--leaf); outline-offset: 1px; border-color: transparent; }
  .field .auto { font-size: 11px; color: var(--ink-soft); }
  .need { display: flex; gap: 8px; flex-wrap: wrap; }
  .need .tag {
    padding: 4px 9px; border-radius: 6px; font-size: 11px; font-weight: 600;
  }
  .tag.sun { background: var(--sun-pale); color: #8a5a12; }
  .tag.water { background: var(--water-pale); color: #35617f; }
  .tag.density { background: var(--leaf-pale); color: var(--leaf-deep); }
  .comp { font-size: 12.5px; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; }
  .comp b { color: var(--ink); }
  .remove { margin-top: 4px; align-self: flex-start; }
  .harvest-badge { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 600; }
  .harvest-badge.ready { background: var(--sun-pale); color: #8a5a12; }
  .harvest-badge.growing { background: var(--leaf-pale); color: var(--leaf-deep); }

  /* ---------- harvest calendar (bottom of stage) ---------- */
  .calendar { margin-top: 22px; max-width: 720px; }
  .calendar h3 { font-family: var(--font-display); font-weight: 600; font-size: 15px; margin-bottom: 10px; }
  .cal-list { display: flex; flex-direction: column; gap: 6px; }
  .cal-row {
    display: grid; grid-template-columns: 64px 1fr 1fr 1fr;
    gap: 10px; align-items: center;
    padding: 8px 12px; border-radius: var(--radius-sm);
    background: var(--card); border: 1px solid var(--line);
    font-size: 12.5px;
  }
  .cal-row.head { background: transparent; border: none; font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); padding: 0 12px; }
  .cal-row .sq { font-weight: 700; color: var(--ink-soft); }
  .cal-row .crop { font-weight: 600; }
  .cal-row .days { color: var(--ink-soft); }

  @media (max-width: 1100px) {
    .layout { grid-template-columns: 210px 1fr; }
    .inspector { display: none; }
  }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; height: auto; }
    .palette { border-right: none; border-bottom: 1px solid var(--line); max-height: 220px; }
    .bed { padding: 12px; gap: 6px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <h1>Farm Bed</h1>
      <span class="sub">square-foot garden · 6×6</span>
    </div>
    <div class="spacer"></div>
    <div class="weather">
      <div class="chip temp"><span class="dot"></span><span class="lbl">Temp</span><span class="val" id="chipTemp">—</span></div>
      <div class="chip sun"><span class="dot"></span><span class="lbl">Sun</span><span class="val" id="chipSun">—</span></div>
      <div class="chip water"><span class="dot"></span><span class="lbl">Moisture</span><span class="val" id="chipMoist">—</span></div>
    </div>
    <div class="chip" id="chipDate"></div>
  </div>

  <div class="layout">
    <!-- palette -->
    <aside class="palette">
      <div class="palette-head">Seed Library <span class="hint">drag onto a square</span></div>
      <div id="paletteGroups"></div>
    </aside>

    <!-- stage -->
    <main class="stage">
      <div class="stage-head">
        <h2>The Bed</h2>
        <span class="meta" id="bedMeta"></span>
        <div class="actions">
          <button class="btn primary" id="btnAutofill">Autofill plan</button>
          <button class="btn" id="btnClear">Clear</button>
        </div>
      </div>
      <div class="bed" id="bed"></div>
      <div class="legend">
        <span><span class="swatch s-ready"></span> ready to harvest</span>
        <span><span class="swatch s-soil"></span> empty square</span>
        <span>click a square to edit · drag a seed to plant</span>
      </div>
      <div class="calendar" id="calendar"></div>
    </main>

    <!-- inspector -->
    <aside class="inspector" id="inspector"></aside>
  </div>

<script>
/* ============ plant library (square-foot gardening) ============ */
const PLANTS = {
  tomato:      { name:'Tomato',       ico:'🍅', per:1,  days:80,  sun:'full',    water:'high',   trellis:true,  grp:'Fruiting',  comp:'Basil, marigold, chives' },
  pepper:      { name:'Pepper',       ico:'🌶️', per:1,  days:75,  sun:'full',    water:'medium', grp:'Fruiting',  comp:'Basil, onion' },
  eggplant:    { name:'Eggplant',     ico:'🍆', per:1,  days:80,  sun:'full',    water:'medium', grp:'Fruiting',  comp:'Beans, marigold' },
  cucumber:    { name:'Cucumber',     ico:'🥒', per:2,  days:60,  sun:'full',    water:'high',   trellis:true,  grp:'Fruiting',  comp:'Beans, radish' },
  cantaloupe:  { name:'Cantaloupe',   ico:'🍈', per:1,  days:85,  sun:'full',    water:'high',   trellis:true,  grp:'Fruiting',  comp:'Marigold' },
  peas:        { name:'Peas',         ico:'🫛', per:8,  days:60,  sun:'full',    water:'medium', trellis:true,  grp:'Legumes',   comp:'Carrot, radish' },
  beans:       { name:'Bush beans',   ico:'🫘', per:9,  days:55,  sun:'full',    water:'medium', grp:'Legumes',   comp:'Carrot, eggplant' },
  broccoli:    { name:'Broccoli',     ico:'🥦', per:1,  days:70,  sun:'full',    water:'medium', grp:'Brassica',  comp:'Onion, dill' },
  cauliflower: { name:'Cauliflower',  ico:'🥬', per:1,  days:65,  sun:'full',    water:'medium', grp:'Brassica',  comp:'Onion, celery' },
  cabbage:     { name:'Cabbage',      ico:'🥬', per:1,  days:90,  sun:'full',    water:'medium', grp:'Brassica',  comp:'Onion, dill' },
  kale:        { name:'Kale',         ico:'🥬', per:4,  days:55,  sun:'full',    water:'medium', grp:'Brassica',  comp:'Onion, beet' },
  lettuce:     { name:'Lettuce',      ico:'🥬', per:4,  days:45,  sun:'partial', water:'medium', grp:'Leafy',     comp:'Carrot, radish' },
  spinach:     { name:'Spinach',      ico:'🍃', per:9,  days:40,  sun:'partial', water:'medium', grp:'Leafy',     comp:'Strawberry, pea' },
  onion:       { name:'Onion',        ico:'🧅', per:16, days:100, sun:'full',    water:'low',    grp:'Root',      comp:'Carrot, lettuce' },
  carrot:      { name:'Carrot',       ico:'🥕', per:16, days:70,  sun:'full',    water:'medium', grp:'Root',      comp:'Onion, pea' },
  beet:        { name:'Beet',         ico:'🫜', per:9,  days:55,  sun:'full',    water:'medium', grp:'Root',      comp:'Onion, kale' },
  radish:      { name:'Radish',       ico:'🫜', per:16, days:25,  sun:'full',    water:'low',    grp:'Root',      comp:'Carrot, cucumber' },
  garlic:      { name:'Garlic',       ico:'🧄', per:9,  days:210, sun:'full',    water:'low',    grp:'Root',      comp:'Tomato, pepper', perennial:true },
  basil:       { name:'Basil',        ico:'🌿', per:4,  days:55,  sun:'full',    water:'medium', grp:'Herb',      comp:'Tomato, pepper' },
  chives:      { name:'Chives',       ico:'🌿', per:16, days:60,  sun:'full',    water:'low',    grp:'Herb',      comp:'Carrot, tomato' },
  lemongrass:  { name:'Lemongrass',   ico:'🌾', per:1,  days:90,  sun:'full',    water:'medium', grp:'Herb',      comp:'Most vegetables' },
  rhubarb:     { name:'Rhubarb',      ico:'🌿', per:1,  days:365, sun:'full',    water:'medium', grp:'Perennial', comp:'Permanent bed', perennial:true },
  strawberry:  { name:'Strawberry',   ico:'🍓', per:4,  days:90,  sun:'full',    water:'medium', grp:'Fruiting',  comp:'Spinach, lettuce', perennial:true },
  marigold:    { name:'Marigold',     ico:'🌼', per:4,  days:50,  sun:'full',    water:'low',    grp:'Flower',    comp:'Tomato, everything', companion:true },
};

/* ============ recommended 6×6 plan (row-major, 36 squares) ============ */
const RECOMMENDED = [
  'tomato','tomato','peas','peas','cantaloupe','cantaloupe',
  'pepper','pepper','eggplant','eggplant','beans','beans',
  'broccoli','cauliflower','cauliflower','cabbage','kale','kale',
  'lettuce','lettuce','lettuce','spinach','spinach','rhubarb',
  'onion','onion','carrot','carrot','beet','garlic',
  'basil','basil','lemongrass','chives','marigold','radish',
];

const GROUP_ORDER = ['Fruiting','Legumes','Brassica','Leafy','Root','Herb','Perennial','Flower'];
const GROUP_LABEL = {
  Fruiting:'Fruiting (tall / trellis)', Legumes:'Legumes', Brassica:'Brassicas',
  Leafy:'Leafy greens', Root:'Roots & bulbs', Herb:'Herbs', Perennial:'Perennials', Flower:'Companion flowers',
};

/* ============ state ============ */
const ROWS = 6, COLS = 6;
const TODAY = '2026-11-09';
const PLANT_DATE = '2026-11-10'; // user plants tomorrow
let grid = load() || Array(ROWS*COLS).fill(null);
let selected = null;

function load() {
  try { return JSON.parse(localStorage.getItem('farmbed-v1')); } catch { return null; }
}
function save() {
  localStorage.setItem('farmbed-v1', JSON.stringify(grid));
}

/* ============ helpers ============ */
const $ = (s) => document.querySelector(s);
const fmt = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
};
function addDays(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}
function rowCol(i) { return { r: Math.floor(i/COLS)+1, c: (i%COLS)+1 }; }
function label(i) { const {r,c} = rowCol(i); return String.fromCharCode(64+r)+c; }

/* ============ weather (placeholders — wire to API/sensor later) ============ */
const WEATHER = { temp:'62°F', sun:'6.1 h', moist:'Damp' };
$('#chipTemp').textContent = WEATHER.temp;
$('#chipSun').textContent = WEATHER.sun;
$('#chipMoist').textContent = WEATHER.moist;
$('#chipDate').textContent = new Date().toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});

/* ============ render palette ============ */
function renderPalette() {
  const wrap = $('#paletteGroups');
  wrap.innerHTML = '';
  for (const g of GROUP_ORDER) {
    const items = Object.entries(PLANTS).filter(([,p]) => p.grp === g);
    if (!items.length) continue;
    const div = document.createElement('div');
    div.className = 'group';
    div.innerHTML = `<div class="group-title">${GROUP_LABEL[g]}</div>`;
    for (const [key, p] of items) {
      const el = document.createElement('div');
      el.className = 'seed';
      el.draggable = true;
      el.dataset.plant = key;
      el.innerHTML = `
        <div class="ico">${p.ico}</div>
        <div class="meta">
          <div class="name">${p.name}</div>
          <div class="spec"><span>${p.per}/sqft</span><span>·</span><span>${p.days}d</span></div>
        </div>
        <div class="drag-handle">⠿</div>`;
      el.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plant', key);
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', () => el.classList.remove('dragging'));
      div.appendChild(el);
    }
    wrap.appendChild(div);
  }
}

/* ============ render bed ============ */
function renderBed() {
  const bed = $('#bed');
  bed.innerHTML = '';
  for (let i = 0; i < ROWS*COLS; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell' + (grid[i] ? ' filled' : ' empty') + (selected === i ? ' selected' : '');
    cell.dataset.i = i;

    const p = grid[i] ? PLANTS[grid[i]] : null;
    const { r, c } = rowCol(i);
    if (p) {
      const exp = addDays(PLANT_DATE, p.days);
      const isReady = new Date(exp) <= new Date();
      if (isReady) cell.classList.add('ready');
      cell.innerHTML = `
        <span class="idx">${label(i)}</span>
        <span class="ico">${p.ico}</span>
        <span class="cname">${p.name}</span>
        <span class="cden">×${p.per}</span>`;
    } else {
      cell.innerHTML = `<span class="idx">${label(i)}</span><span class="plus">＋</span>`;
    }

    cell.addEventListener('click', () => { selected = i; renderBed(); renderInspector(); });
    cell.addEventListener('dragover', (e) => { e.preventDefault(); cell.classList.add('drag-over'); });
    cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
    cell.addEventListener('drop', (e) => {
      e.preventDefault();
      cell.classList.remove('drag-over');
      const plant = e.dataTransfer.getData('text/plant');
      if (plant && PLANTS[plant]) {
        grid[i] = plant;
        selected = i;
        save(); renderBed(); renderInspector(); renderCalendar();
      }
    });
    bed.appendChild(cell);
  }
  const used = grid.filter(Boolean).length;
  $('#bedMeta').textContent = `${used} / ${ROWS*COLS} squares planted`;
}

/* ============ render inspector ============ */
function renderInspector() {
  const ins = $('#inspector');
  if (selected === null || !grid[selected]) {
    ins.innerHTML = `<div class="insp-empty"><div class="big">🌱</div>Click a square to see its plan, or drag a seed from the library onto the bed.</div>`;
    return;
  }
  const key = grid[selected];
  const p = PLANTS[key];
  const { r, c } = rowCol(selected);
  const sqLabel = label(selected);
  const planted = PLANT_DATE;
  const exp = addDays(planted, p.days);
  const isReady = new Date(exp) <= new Date();

  ins.innerHTML = `
    <div class="insp-body">
      <div class="insp-head">
        <div class="ico">${p.ico}</div>
        <div><div class="t">${p.name}</div><div class="s">Square ${sqLabel} · row ${r}, col ${c}</div></div>
      </div>
      <div class="harvest-badge ${isReady ? 'ready' : 'growing'}">
        ${isReady ? '● Ready to harvest' : '● Growing'} — expected ${fmt(exp)}
      </div>
      <div class="need">
        <span class="tag density">${p.per} per square</span>
        <span class="tag sun">${p.sun === 'full' ? 'Full sun' : 'Partial shade'}</span>
        <span class="tag water">${p.water === 'high' ? 'High' : p.water === 'low' ? 'Low' : 'Medium'} water</span>
        ${p.trellis ? '<span class="tag water">Trellis</span>' : ''}
      </div>
      <div class="field">
        <label>Plant date</label>
        <input type="date" value="${planted}" id="fPlant">
      </div>
      <div class="field">
        <label>Expected harvest</label>
        <input type="date" value="${exp}" id="fExp" readonly>
        <span class="auto">auto = plant date + ${p.days} days to maturity</span>
      </div>
      <div class="field">
        <label>Actual harvest</label>
        <input type="date" id="fAct" placeholder="set when picked">
      </div>
      <div class="field">
        <label>Replant date</label>
        <input type="date" id="fReplant" placeholder="after harvest + compost">
      </div>
      <div class="comp"><b>Companions:</b> ${p.comp}. ${p.companion ? 'Plant as a pest-deterrent companion.' : ''} ${p.perennial ? '<b>Perennial</b> — keep this square reserved; it does not rotate.' : ''}</div>
      <button class="btn ghost remove" id="btnRemove">Remove from square</button>
    </div>`;

  $('#fPlant').addEventListener('change', (e) => {
    // recompute expected harvest from new plant date
    const exp2 = addDays(e.target.value, p.days);
    $('#fExp').value = exp2;
    $('#fExp').nextElementSibling.textContent = 'auto = plant date + ' + p.days + ' days to maturity';
    renderCalendar();
  });
  $('#btnRemove').addEventListener('click', () => {
    grid[selected] = null; save(); renderBed(); renderInspector(); renderCalendar();
  });
}

/* ============ harvest calendar ============ */
function renderCalendar() {
  const wrap = $('#calendar');
  const planted = grid.map((g, i) => ({ g, i })).filter(x => x.g);
  if (!planted.length) { wrap.innerHTML = ''; return; }
  const sorted = [...planted].sort((a, b) => {
    const ea = addDays(PLANT_DATE, PLANTS[a.g].days);
    const eb = addDays(PLANT_DATE, PLANTS[b.g].days);
    return ea.localeCompare(eb);
  });
  let html = `<h3>Harvest calendar</h3><div class="cal-list">`;
  html += `<div class="cal-row head"><span>Square</span><span>Crop</span><span>Plant date</span><span>Expected harvest</span></div>`;
  for (const { g, i } of sorted) {
    const p = PLANTS[g];
    const exp = addDays(PLANT_DATE, p.days);
    const isReady = new Date(exp) <= new Date();
    html += `<div class="cal-row">
      <span class="sq">${label(i)}</span>
      <span class="crop">${p.ico} ${p.name} ${isReady ? '· ready' : ''}</span>
      <span>${fmt(PLANT_DATE)}</span>
      <span class="days">${fmt(exp)} <span style="color:var(--ink-soft)">(${p.days}d)</span></span>
    </div>`;
  }
  wrap.innerHTML = html + '</div>';
}

/* ============ actions ============ */
$('#btnAutofill').addEventListener('click', () => {
  grid = [...RECOMMENDED];
  save(); renderBed(); renderInspector(); renderCalendar();
});
$('#btnClear').addEventListener('click', () => {
  grid = Array(ROWS*COLS).fill(null);
  save(); renderBed(); renderInspector(); renderCalendar();
});

/* ============ init ============ */
renderPalette();
renderBed();
renderInspector();
renderCalendar();
</script>
</body>
</html>
