<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Farm Bed — Edit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><h1>Farm Bed</h1><span class="sub">edit</span></div>
    <div class="spacer"></div>
    <nav class="nav">
      <a href="/">Overview</a>
      <a href="/edit" class="active">Edit bed</a>
    </nav>
    <div class="spacer"></div>
    <div class="weather">
      <div class="chip temp"><span class="dot"></span><span class="lbl">Temp</span><span class="val" id="chipTemp">—</span></div>
      <div class="chip sun"><span class="dot"></span><span class="lbl">Sun</span><span class="val" id="chipSun">—</span></div>
      <div class="chip water"><span class="dot"></span><span class="lbl">Moist</span><span class="val" id="chipMoist">—</span></div>
    </div>
  </div>

  <div class="layout-desktop">
    <aside class="palette">
      <div class="palette-head">Seed Library <span class="hint">drag onto a square</span></div>
      <div id="paletteGroups"></div>
    </aside>

    <main class="stage">
      <div class="stage-head">
        <h2>The Bed — 6×6</h2>
        <span class="meta" id="bedMeta"></span>
        <div class="actions">
          <div class="viewtoggle" id="viewToggle">
            <button class="vt active" data-view="grid">Grid</button>
            <button class="vt" data-view="cam">Camera</button>
          </div>
          <button class="btn primary" id="btnAutofill">Autofill plan</button>
          <button class="btn" id="btnClear">Clear</button>
        </div>
      </div>
      <div class="view" id="viewGrid">
        <div class="bed" id="bed"></div>
        <div class="legend">
          <span><span class="swatch s-ready"></span> ready to harvest</span>
          <span><span class="swatch s-soil"></span> empty square</span>
          <span>tap a square to edit</span>
        </div>
        <div id="calendar"></div>
      </div>
      <div class="view" id="viewCam" hidden>
        <div class="panel">
          <div class="panel-head" style="display:flex;align-items:center;justify-content:space-between">
            <h3 style="margin:0">Latest from the camera</h3>
            <button class="btn" id="btnRefresh">↻ Refresh</button>
          </div>
          <div class="latest" id="latest"></div>
          <div class="sub">swipe → through past captures</div>
          <div class="strip" id="strip"></div>
        </div>
      </div>
    </main>

    <aside class="inspector" id="inspector"></aside>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet"></div>

  <nav class="bottomnav">
    <a href="/"><span class="ic">▦</span>Overview</a>
    <a href="/edit" class="active"><span class="ic">✎</span>Edit</a>
  </nav>

<script src="/static/app.js"></script>
<script>
let PLANTS = null;
let RECOMMENDED = null;
let SQUARES = [];
let selected = null;

const GROUP_ORDER = ['Fruiting','Legumes','Brassica','Leafy','Root','Herb','Perennial','Flower'];
const GROUP_LABEL = { Fruiting:'Fruiting (tall / trellis)', Legumes:'Legumes', Brassica:'Brassicas', Leafy:'Leafy greens', Root:'Roots & bulbs', Herb:'Herbs', Perennial:'Perennials', Flower:'Companion flowers' };

function isDesktop() { return window.matchMedia('(min-width: 900px)').matches; }
function label(i) { const r = Math.floor(i/6)+1, c = (i%6)+1; return String.fromCharCode(64+r)+c; }

async function reload() {
  const bed = await API.get('/api/bed');
  SQUARES = bed.squares;
  renderBed(); renderInspector(); renderCalendar();
}

function renderPalette() {
  const wrap = $('#paletteGroups');
  wrap.innerHTML = '';
  for (const g of GROUP_ORDER) {
    const items = Object.entries(PLANTS).filter(([,p]) => p.grp === g);
    if (!items.length) continue;
    const div = document.createElement('div');
    div.className = 'group';
    div.innerHTML = `<div class="group-title">${GROUP_LABEL[g]}</div>`;
    for (const [key, p] of items) {
      const el = document.createElement('div');
      el.className = 'seed'; el.draggable = true; el.dataset.plant = key;
      el.innerHTML = `<div class="ico">${p.ico}</div>
        <div class="meta"><div class="name">${p.name}</div><div class="spec">${p.per}/sqft · ${p.days}d</div></div>
        <div class="drag-handle">⠿</div>`;
      el.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plant', key); });
      div.appendChild(el);
    }
    wrap.appendChild(div);
  }
}

function renderBed() {
  const bed = $('#bed');
  bed.innerHTML = '';
  SQUARES.forEach((s, i) => {
    const cell = document.createElement('div');
    const p = s.planting;
    cell.className = 'cell' + (p ? ' filled' : ' empty') + (selected === i ? ' selected' : '');
    if (p && p.expected_harvest_at && p.expected_harvest_at <= todayISO()) cell.classList.add('ready');
    cell.innerHTML = p
      ? `<span class="idx">${s.label}</span><span class="ico">${p.ico}</span><span class="cname">${p.plant_name}</span><span class="cden">×${p.per}</span>`
      : `<span class="idx">${s.label}</span><span class="plus">＋</span>`;
    cell.addEventListener('click', () => { selected = i; renderBed(); openSquare(i); });
    cell.addEventListener('dragover', (e) => { e.preventDefault(); cell.classList.add('drag-over'); });
    cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
    cell.addEventListener('drop', async (e) => {
      e.preventDefault(); cell.classList.remove('drag-over');
      const plant = e.dataTransfer.getData('text/plant');
      if (plant && PLANTS[plant]) { await API.post(`/api/squares/${s.id}/plant`, { plant_key: plant, planted_at: todayISO() }); await reload(); }
    });
    bed.appendChild(cell);
  });
  // north marker: fence = north = right side (matches the camera view)
  const nt = document.createElement('div');
  nt.className = 'north-tag';
  nt.innerHTML = '<span class="arr">N →</span> Fence';
  bed.appendChild(nt);
  const fe = document.createElement('div');
  fe.className = 'fence-edge';
  bed.appendChild(fe);
  const used = SQUARES.filter(s => s.planting).length;
  $('#bedMeta').textContent = `${used} / ${SQUARES.length} planted`;
}

/* ---------- bottom sheet + desktop inspector ---------- */
function sheetHTML(i) {
  const s = SQUARES[i];
  const p = s.planting;
  const head = `
    <div class="sheet-head">
      <div class="ico">${p ? p.ico : '＋'}</div>
      <div><div class="t">${p ? p.plant_name : 'Plant ' + s.label}</div><div class="s">Square ${s.label} · ${p ? '' : 'pick a crop'}</div></div>
      <button class="sheet-close" id="sheetClose">✕</button>
    </div>`;
  const picker = `<div class="sheet-section-title">Choose a plant</div><div class="picker">${
    Object.entries(PLANTS).map(([key, pl]) =>
      `<div class="opt" data-plant="${key}"><span class="pico">${pl.ico}</span><span class="pname">${pl.name}</span><span class="pspec">${pl.per}/sq</span></div>`
    ).join('')
  }</div>`;
  let details = '';
  if (p) {
    const ready = p.expected_harvest_at && p.expected_harvest_at <= todayISO();
    details = `
      <div class="harvest-badge ${ready ? 'ready' : 'growing'}">${ready ? '● Ready to harvest' : '● Growing'} — expected ${fmtDate(p.expected_harvest_at)}</div>
      <div class="need">
        <span class="tag density">${p.per} per square</span>
        <span class="tag sun">${p.sun === 'full' ? 'Full sun' : 'Partial shade'}</span>
        <span class="tag water">${p.water === 'high' ? 'High' : p.water === 'low' ? 'Low' : 'Medium'} water</span>
        ${p.trellis ? '<span class="tag water">Trellis</span>' : ''}
      </div>
      <div class="field"><label>Planted</label><input type="date" value="${p.planted_at || ''}" id="fPlant"></div>
      <div class="field"><label>Expected harvest</label><input type="date" value="${p.expected_harvest_at || ''}" readonly><span class="auto">auto = plant date + ${p.days} days</span></div>
      <div class="comp"><b>Companions:</b> ${p.comp}. ${PLANTS[p.plant_key]?.perennial ? '<b>Perennial</b> — keep reserved.' : ''}</div>
      <div class="sheet-actions">
        <button class="btn" id="btnHarvest" style="color:var(--leaf)">✓ Harvested</button>
        <button class="btn" id="btnRemove" style="color:var(--danger)">Remove</button>
      </div>`;
  }
  return head + `<div class="sheet-body">${picker}${details}</div>`;
}

function openSquare(i) {
  const s = SQUARES[i];
  if (isDesktop()) { renderInspector(); return; }
  const sheet = $('#sheet');
  const backdrop = $('#sheetBackdrop');
  sheet.innerHTML = `<div class="grab"></div>` + sheetHTML(i);
  sheet.classList.add('open');
  backdrop.classList.add('open');
  const close = () => { sheet.classList.remove('open'); backdrop.classList.remove('open'); };
  $('#sheetClose').addEventListener('click', close);
  backdrop.addEventListener('click', close);
  sheet.querySelectorAll('.picker .opt').forEach(opt => opt.addEventListener('click', async () => {
    await API.post(`/api/squares/${s.id}/plant`, { plant_key: opt.dataset.plant, planted_at: todayISO() });
    await reload(); close();
  }));
  const btnRemove = $('#btnRemove');
  if (btnRemove) btnRemove.addEventListener('click', async () => { await API.del(`/api/squares/${s.id}/plant`); await reload(); close(); });
  const btnHarvest = $('#btnHarvest');
  if (btnHarvest) btnHarvest.addEventListener('click', async () => {
    try { await API.post(`/api/plantings/${s.planting.id}/harvest`, { harvested_at: todayISO() }); } catch {}
    await reload(); close();
  });
  const fPlant = $('#fPlant');
  if (fPlant) fPlant.addEventListener('change', async (e) => {
    await API.post(`/api/squares/${s.id}/plant`, { plant_key: s.planting.plant_key, planted_at: e.target.value });
    await reload(); close();
  });
}

function renderInspector() {
  const ins = $('#inspector');
  if (!ins) return;
  if (selected === null || !SQUARES[selected] || !SQUARES[selected].planting) {
    ins.innerHTML = `<div class="insp-empty"><div class="big">🌱</div>Click a square to edit, or drag a seed from the library.</div>`;
    return;
  }
  const s = SQUARES[selected], p = s.planting;
  const ready = p.expected_harvest_at && p.expected_harvest_at <= todayISO();
  ins.innerHTML = `<div style="padding:18px 20px;display:flex;flex-direction:column;gap:14px">
    <div class="sheet-head" style="padding:0"><div class="ico">${p.ico}</div><div><div class="t">${p.plant_name}</div><div class="s">Square ${s.label}</div></div></div>
    <div class="harvest-badge ${ready?'ready':'growing'}">${ready?'● Ready to harvest':'● Growing'} — expected ${fmtDate(p.expected_harvest_at)}</div>
    <div class="need"><span class="tag density">${p.per}/sqft</span><span class="tag sun">${p.sun==='full'?'Full sun':'Partial shade'}</span><span class="tag water">${p.water}</span>${p.trellis?'<span class="tag water">Trellis</span>':''}</div>
    <div class="field"><label>Planted</label><input type="date" value="${p.planted_at||''}" id="dPlant"></div>
    <div class="field"><label>Expected harvest</label><input type="date" value="${p.expected_harvest_at||''}" readonly></div>
    <div class="comp"><b>Companions:</b> ${p.comp}</div>
    <div class="sheet-actions"><button class="btn" id="dHarvest" style="color:var(--leaf)">✓ Harvested</button><button class="btn" id="dRemove" style="color:var(--danger)">Remove</button></div>
  </div>`;
  $('#dPlant').addEventListener('change', async (e) => { await API.post(`/api/squares/${s.id}/plant`, { plant_key: p.plant_key, planted_at: e.target.value }); await reload(); });
  $('#dRemove').addEventListener('click', async () => { await API.del(`/api/squares/${s.id}/plant`); await reload(); });
  $('#dHarvest').addEventListener('click', async () => { try { await API.post(`/api/plantings/${p.id}/harvest`, { harvested_at: todayISO() }); } catch {} await reload(); });
}

function renderCalendar() {
  const wrap = $('#calendar');
  const planted = SQUARES.filter(s => s.planting).sort((a,b) => (a.planting.expected_harvest_at||'').localeCompare(b.planting.expected_harvest_at||''));
  if (!planted.length) { wrap.innerHTML = ''; return; }
  let html = `<div class="cal-list" style="margin-top:18px"><div class="cal-row head"><span>Square</span><span>Crop</span><span>Expected</span></div>`;
  for (const s of planted) {
    const p = s.planting;
    const ready = p.expected_harvest_at && p.expected_harvest_at <= todayISO();
    html += `<div class="cal-row"><span class="sq">${s.label}</span><span class="crop">${p.ico} ${p.plant_name}</span><span class="date ${ready?'ready':''}">${ready?'Ready':fmtDate(p.expected_harvest_at)}</span></div>`;
  }
  wrap.innerHTML = html + '</div>';
}

$('#btnAutofill').addEventListener('click', async () => {
  for (let i = 0; i < SQUARES.length; i++) {
    const key = RECOMMENDED[i];
    if (key) await API.post(`/api/squares/${SQUARES[i].id}/plant`, { plant_key: key, planted_at: todayISO() });
  }
  await reload();
});
$('#btnClear').addEventListener('click', async () => {
  for (const s of SQUARES) if (s.planting) await API.del(`/api/squares/${s.id}/plant`);
  await reload();
});

(async () => {
  renderWeather();
  PLANTS = await getPlants();
  RECOMMENDED = await getRecommended();
  renderPalette();
  await reload();
})();

/* ---------- Grid / Camera toggle ---------- */
function showLatestCam(m) {
  const isVideo = m.kind === 'sweep';
  $('#latest').innerHTML = `
    <div class="shot">${isVideo
      ? `<video src="${m.url}" controls autoplay></video>`
      : `<img src="${m.url}" alt="capture">`}</div>
    ${m.analysis ? `<div class="ai"><b>AI read:</b> ${m.analysis}</div>` : ''}
    <div style="color:var(--ink-soft);font-size:12px">${m.kind} · ${m.captured_at ? fmtDateFull(m.captured_at) : ''}</div>`;
}
async function renderCamera() {
  let media;
  try { media = await API.get('/api/media'); } catch { media = { media: [] }; }
  const m = media.media || [];
  if (!m.length) {
    $('#latest').innerHTML = '<div class="empty">No captures yet — the camera service runs hourly.</div>';
    $('#strip').innerHTML = '';
    return;
  }
  showLatestCam(m[0]);
  $('#strip').innerHTML = m.map(x => {
    const isVideo = x.kind === 'sweep';
    return `<div class="thumb" data-url="${x.url}" data-kind="${x.kind}" data-analysis="${encodeURIComponent(x.analysis || '')}">
      ${isVideo
        ? '<span style="display:grid;place-items:center;height:100%;font-size:28px;color:#fff">▶</span>'
        : `<img src="${x.url}" alt="" loading="lazy">`}
      <span class="badge">${x.kind}</span><span class="when">${fmtDate(x.captured_at)}</span>
    </div>`;
  }).join('');
  $('#strip').querySelectorAll('.thumb').forEach(t => t.addEventListener('click', () => {
    showLatestCam({ url: t.dataset.url, kind: t.dataset.kind, analysis: decodeURIComponent(t.dataset.analysis) });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }));
}
$('#viewToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('.vt'); if (!btn) return;
  const v = btn.dataset.view;
  $('#viewGrid').hidden = v !== 'grid';
  $('#viewCam').hidden = v !== 'cam';
  document.querySelectorAll('.vt').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  if (isDesktop()) {
    const palette = document.querySelector('.palette');
    const inspector = document.querySelector('#inspector');
    if (palette) palette.style.display = v === 'grid' ? '' : 'none';
    if (inspector) inspector.style.display = v === 'grid' ? '' : 'none';
  }
  if (v === 'cam') renderCamera();
});
$('#btnRefresh').addEventListener('click', () => renderCamera());
// auto-refresh the camera view every 60s while it's open (near-live feel)
setInterval(() => {
  if (!$('#viewCam').hidden) renderCamera();
}, 60000);
</script>
</body>
</html>
